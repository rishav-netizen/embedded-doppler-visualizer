<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="bgGradPhys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowSub" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#bgGradPhys)"/>
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="500" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">AERODYNAMIC REGIMES &amp; WAVEFRONT GEOMETRY IN SIMULATION</text>

  <!-- PANEL 1: Subsonic (M = 0.6) -->
  <g transform="translate(20, 45)">
    <rect width="300" height="255" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="150" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Subsonic (M = 0.6)</text>
    <text x="150" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">v_source &lt; c (Sound Speed)</text>

    <!-- Circles centered at t=0, t=1, t=2, t=3 -->
    <!-- Sound source moving right from x=90 to x=210 -->
    <circle cx="90" cy="140" r="95" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="120" cy="140" r="72" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="150" cy="140" r="48" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-opacity="0.75"/>
    <circle cx="180" cy="140" r="24" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Source point -->
    <circle cx="210" cy="140" r="6" fill="#ef4444"/>
    <!-- Velocity Arrow -->
    <line x1="210" y1="140" x2="245" y2="140" stroke="#facc15" stroke-width="2.5"/>
    <polygon points="248,140 242,136 242,144" fill="#facc15"/>
    <text x="245" y="132" fill="#facc15" font-family="monospace" font-size="10" font-weight="bold">v</text>

    <text x="150" y="222" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Wave compression ahead: λ' &lt; λ</text>
    <text x="150" y="240" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Doppler Shift: f' = f₀ · [c / (c - v)]</text>
  </g>

  <!-- PANEL 2: Transonic (M = 1.0) -->
  <g transform="translate(350, 45)">
    <rect width="300" height="255" rx="10" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>
    <text x="150" y="24" fill="#facc15" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Transonic Barrier (M = 1.0)</text>
    <text x="150" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">v_source = c (Critical Limit)</text>

    <!-- Circles centered such that right edge touches x=220 -->
    <circle cx="110" cy="140" r="110" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="140" cy="140" r="80" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="170" cy="140" r="50" fill="none" stroke="#eab308" stroke-width="1.8" stroke-opacity="0.75"/>
    <circle cx="200" cy="140" r="20" fill="none" stroke="#facc15" stroke-width="2"/>

    <!-- Shock Front Barrier Wall (Vertical tangent line) -->
    <line x1="220" y1="48" x2="220" y2="232" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3 3"/>

    <!-- Source point -->
    <circle cx="220" cy="140" r="6" fill="#ef4444"/>
    <!-- Velocity Arrow -->
    <line x1="220" y1="140" x2="260" y2="140" stroke="#facc15" stroke-width="2.5"/>
    <polygon points="263,140 257,136 257,144" fill="#facc15"/>
    <text x="260" y="132" fill="#facc15" font-family="monospace" font-size="10" font-weight="bold">c</text>

    <text x="150" y="222" fill="#facc15" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Wavefronts Coalesce at Front</text>
    <text x="150" y="240" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Acoustic pressure singularity wall</text>
  </g>

  <!-- PANEL 3: Supersonic (M = 1.6) -->
  <g transform="translate(680, 45)">
    <rect width="300" height="255" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
    <text x="150" y="24" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Supersonic (M = 1.6)</text>
    <text x="150" y="40" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">v_source &gt; c (Mach Wake Cone)</text>

    <!-- Source is ahead of all waves -->
    <!-- Circles emitted at x=50 (r=75), x=100 (r=50), x=150 (r=25) -->
    <!-- Source currently at x=235 -->
    <circle cx="65" cy="140" r="80" fill="none" stroke="#be185d" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="115" cy="140" r="54" fill="none" stroke="#db2777" stroke-width="1.5" stroke-opacity="0.55"/>
    <circle cx="165" cy="140" r="28" fill="none" stroke="#f472b6" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Mach Cone Tangent Lines -->
    <!-- Angle mu = arcsin(1/1.6) ~ 38.68 deg. -->
    <line x1="235" y1="140" x2="20" y2="28" stroke="#ec4899" stroke-width="2.5"/>
    <line x1="235" y1="140" x2="20" y2="252" stroke="#ec4899" stroke-width="2.5"/>

    <!-- Source point -->
    <circle cx="235" cy="140" r="6" fill="#ef4444"/>
    <!-- Velocity Arrow -->
    <line x1="235" y1="140" x2="275" y2="140" stroke="#facc15" stroke-width="2.5"/>
    <polygon points="278,140 272,136 272,144" fill="#facc15"/>
    <text x="275" y="132" fill="#facc15" font-family="monospace" font-size="10" font-weight="bold">v &gt; c</text>

    <!-- Mach Angle Label -->
    <path d="M 205 140 A 30 30 0 0 1 208 126" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="195" y="130" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">μ</text>

    <text x="150" y="222" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mach Cone: sin(μ) = 1 / M</text>
    <text x="150" y="240" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Shock envelope generates Sonic Boom</text>
  </g>
</svg>