<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="950" height="320">
  <defs>
    <linearGradient id="bgHw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#151e33"/>
    </linearGradient>
    <linearGradient id="unoPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00878a"/>
      <stop offset="100%" stop-color="#005d5f"/>
    </linearGradient>
    <linearGradient id="joyPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="icGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="hwShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="320" rx="14" fill="url(#bgHw)"/>
  <rect x="1" y="1" width="948" height="318" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="475" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PHYSICAL HARDWARE-IN-THE-LOOP WIRING SCHEMATIC</text>

  <!-- ================= LEFT: KY-023 JOYSTICK MODULE ================= -->
  <g transform="translate(40, 50)" filter="url(#hwShadow)">
    <!-- PCB Base -->
    <rect width="250" height="230" rx="12" fill="url(#joyPcb)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">KY-023 2-Axis Joystick</text>
    <text x="125" y="38" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Dual 10kΩ Potentiometers + Push Switch</text>

    <!-- Outer thumbstick well -->
    <circle cx="125" cy="115" r="55" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="125" cy="115" r="42" fill="url(#stickGrad)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Center thumb cap -->
    <circle cx="125" cy="115" r="24" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="125" cy="115" r="8" fill="#1e293b"/>
    <!-- Direction arrows on joystick -->
    <text x="125" y="70" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">▲ -Y</text>
    <text x="125" y="172" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">▼ +Y</text>
    <text x="73" y="119" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">◀ -X</text>
    <text x="177" y="119" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">+X ▶</text>

    <!-- Pin Header Block at Bottom -->
    <rect x="25" y="190" width="200" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- 5 Pins -->
    <circle cx="45" cy="204" r="5" fill="#ef4444"/>
    <text x="45" y="228" fill="#ef4444" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">VCC</text>

    <circle cx="85" cy="204" r="5" fill="#94a3b8"/>
    <text x="85" y="228" fill="#cbd5e1" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">GND</text>

    <circle cx="125" cy="204" r="5" fill="#38bdf8"/>
    <text x="125" y="228" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">VRX</text>

    <circle cx="165" cy="204" r="5" fill="#2dd4bf"/>
    <text x="165" y="228" fill="#2dd4bf" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">VRY</text>

    <circle cx="205" cy="204" r="5" fill="#fbbf24"/>
    <text x="205" y="228" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">SW</text>
  </g>

  <!-- ================= RIGHT: ARDUINO UNO BOARD ================= -->
  <g transform="translate(630, 50)" filter="url(#hwShadow)">
    <!-- Arduino PCB Base -->
    <rect width="280" height="230" rx="12" fill="url(#unoPcb)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="140" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Arduino Uno (ATmega328P)</text>
    <text x="140" y="38" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">16 MHz • 10-bit SAR ADC • USB-UART</text>

    <!-- USB-B Port (Silver) -->
    <rect x="-10" y="55" width="38" height="46" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="2" y="66" width="18" height="24" rx="2" fill="#475569"/>
    <text x="8" y="115" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="middle">USB 115200</text>

    <!-- DC Barrel Jack (Black) -->
    <rect x="-8" y="145" width="34" height="42" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="8" cy="166" r="6" fill="#0f172a"/>

    <!-- ATmega328P DIP-28 Chip (Dark Grey IC) -->
    <rect x="75" y="85" width="130" height="46" rx="4" fill="url(#icGrad)" stroke="#1a202c" stroke-width="1.5"/>
    <circle cx="85" cy="108" r="4" fill="#111827"/>
    <text x="142" y="108" fill="#e2e8f0" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ATmega328P</text>
    <text x="142" y="122" fill="#94a3b8" font-family="monospace" font-size="7.5" text-anchor="middle">16 MHz Crystal</text>

    <!-- Analog Pin Header (A0 - A5) on Bottom Left -->
    <rect x="45" y="185" width="105" height="26" rx="4" fill="#090d16" stroke="#004d40" stroke-width="1"/>
    <circle cx="60" cy="198" r="4" fill="#38bdf8"/>
    <text x="60" y="222" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">A0</text>
    <circle cx="80" cy="198" r="4" fill="#2dd4bf"/>
    <text x="80" y="222" fill="#2dd4bf" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">A1</text>
    <circle cx="100" cy="198" r="3" fill="#64748b"/>
    <circle cx="118" cy="198" r="3" fill="#64748b"/>
    <circle cx="136" cy="198" r="3" fill="#64748b"/>

    <!-- Power Pin Header (5V, GND) on Bottom Center -->
    <rect x="160" y="185" width="55" height="26" rx="4" fill="#090d16" stroke="#004d40" stroke-width="1"/>
    <circle cx="174" cy="198" r="4" fill="#ef4444"/>
    <text x="174" y="222" fill="#ef4444" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">5V</text>
    <circle cx="196" cy="198" r="4" fill="#cbd5e1"/>
    <text x="196" y="222" fill="#cbd5e1" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">GND</text>

    <!-- Digital Pin Header (D2) on Top Right -->
    <rect x="225" y="185" width="45" height="26" rx="4" fill="#090d16" stroke="#004d40" stroke-width="1"/>
    <circle cx="245" cy="198" r="4" fill="#fbbf24"/>
    <text x="245" y="222" fill="#fbbf24" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">D2</text>
  </g>

  <!-- ================= CENTER: COLOR-CODED JUMPER WIRES ================= -->
  <!-- Wire 1: VCC (Red) -->
  <path d="M 85 254 C 85 295, 804 295, 804 254" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="0"/>
  <!-- Wire 2: GND (Slate) -->
  <path d="M 125 254 C 125 285, 826 285, 826 254" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Wire 3: VRX -> A0 (Cyan) -->
  <path d="M 165 254 C 165 275, 690 275, 690 254" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Wire 4: VRY -> A1 (Teal) -->
  <path d="M 205 254 C 205 265, 710 265, 710 254" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
  <!-- Wire 5: SW -> D2 (Amber) -->
  <path d="M 245 254 C 245 305, 875 305, 875 254" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Center Telemetry Protocol Box -->
  <g transform="translate(325, 75)" filter="url(#hwShadow)">
    <rect width="270" height="155" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="270" height="28" rx="10" fill="#6d28d9"/>
    <rect x="0" y="16" width="270" height="12" fill="#6d28d9"/>
    <text x="135" y="19" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">High-Speed Serial Link (UART)</text>

    <text x="15" y="48" fill="#facc15" font-family="monospace" font-size="9" font-weight="bold">Baud Rate: 115,200 (8-N-1)</text>
    <text x="15" y="65" fill="#cbd5e1" font-family="monospace" font-size="8.5">Stream: &lt;X&gt;,&lt;Y&gt;,&lt;SW&gt;
 @ 60 Hz</text>

    <line x1="15" y1="74" x2="255" y2="74" stroke="#334155" stroke-width="1"/>

    <text x="15" y="92" fill="#38bdf8" font-family="monospace" font-size="8.5">• VRX (A0): 0 – 1023 (Horiz)</text>
    <text x="15" y="108" fill="#2dd4bf" font-family="monospace" font-size="8.5">• VRY (A1): 0 – 1023 (Vert)</text>
    <text x="15" y="124" fill="#fbbf24" font-family="monospace" font-size="8.5">• SW  (D2): PULLUP (0=Press)</text>
    <text x="135" y="145" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Low-Latency Hardware-in-the-Loop</text>
  </g>
</svg>