<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bgGradOOP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="headerPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="headerAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="headerTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="headerPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bgGradOOP)"/>
  <rect x="1" y="1" width="998" height="518" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="500" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">OBJECT-ORIENTED CLASS HIERARCHY &amp; DESIGN PATTERNS</text>

  <!-- 1. IInputController (Interface) -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <rect width="270" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="270" height="34" rx="10" fill="url(#headerBlue)"/>
    <rect x="0" y="22" width="270" height="12" fill="url(#headerBlue)"/>
    <text x="135" y="16" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle" font-style="italic">&lt;&lt;interface&gt;&gt;</text>
    <text x="135" y="29" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">IInputController</text>

    <line x1="0" y1="34" x2="270" y2="34" stroke="#38bdf8" stroke-width="1"/>
    <!-- Methods -->
    <text x="15" y="55" fill="#facc15" font-family="monospace" font-size="10">+ ~IInputController() = default</text>
    <text x="15" y="75" fill="#38bdf8" font-family="monospace" font-size="10">+ pollInput(): void = 0</text>
    <text x="15" y="95" fill="#38bdf8" font-family="monospace" font-size="10">+ getVelocity(): Vector2 = 0</text>
    <text x="15" y="115" fill="#38bdf8" font-family="monospace" font-size="10">+ isResetTriggered(): bool = 0</text>
    <text x="15" y="135" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-style="italic">Polymorphic Hardware Abstraction</text>
  </g>

  <!-- Inheritance lines from IInputController -->
  <!-- Left branch to JoystickSerialController -->
  <path d="M 100 210 L 100 250" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="100,210 95,220 105,220" fill="#38bdf8"/>
  <!-- Right branch to KeyboardFallbackController -->
  <path d="M 230 210 L 230 250" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="230,210 225,220 235,220" fill="#38bdf8"/>

  <!-- 2. JoystickSerialController (Concrete) -->
  <g transform="translate(15, 250)" filter="url(#shadow)">
    <rect width="210" height="235" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect width="210" height="30" rx="10" fill="url(#headerTeal)"/>
    <rect x="0" y="20" width="210" height="10" fill="url(#headerTeal)"/>
    <text x="105" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">JoystickController</text>

    <text x="10" y="45" fill="#cbd5e1" font-family="monospace" font-size="9">- serialFd: int</text>
    <text x="10" y="60" fill="#cbd5e1" font-family="monospace" font-size="9">- baudRate: int = 115200</text>
    <text x="10" y="75" fill="#cbd5e1" font-family="monospace" font-size="9">- deadband: float = 25.0</text>
    <text x="10" y="90" fill="#cbd5e1" font-family="monospace" font-size="9">- worker: std::thread</text>
    <text x="10" y="105" fill="#cbd5e1" font-family="monospace" font-size="9">- rawVel: atomic&lt;Vector2&gt;</text>
    <text x="10" y="120" fill="#cbd5e1" font-family="monospace" font-size="9">- btnState: atomic&lt;bool&gt;</text>

    <line x1="0" y1="130" x2="210" y2="130" stroke="#334155" stroke-width="1"/>

    <text x="10" y="148" fill="#2dd4bf" font-family="monospace" font-size="9">+ pollInput() override</text>
    <text x="10" y="163" fill="#2dd4bf" font-family="monospace" font-size="9">+ getVelocity() override</text>
    <text x="10" y="178" fill="#2dd4bf" font-family="monospace" font-size="9">+ isResetTriggered()</text>
    <text x="10" y="195" fill="#94a3b8" font-family="monospace" font-size="8.5">- workerLoop(): void</text>
    <text x="10" y="210" fill="#94a3b8" font-family="monospace" font-size="8.5">- parseCSV(string): void</text>
    <text x="105" y="226" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle" font-style="italic">Telemetry Ingestion Layer</text>
  </g>

  <!-- 3. KeyboardFallbackController (Concrete) -->
  <g transform="translate(235, 250)" filter="url(#shadow)">
    <rect width="180" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="180" height="30" rx="10" fill="url(#headerBlue)"/>
    <rect x="0" y="20" width="180" height="10" fill="url(#headerBlue)"/>
    <text x="90" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">KeyboardFallback</text>

    <text x="10" y="50" fill="#cbd5e1" font-family="monospace" font-size="9">- speed: float</text>
    <text x="10" y="68" fill="#cbd5e1" font-family="monospace" font-size="9">- activeVel: Vector2</text>
    <text x="10" y="86" fill="#cbd5e1" font-family="monospace" font-size="9">- resetDown: bool</text>

    <line x1="0" y1="105" x2="180" y2="105" stroke="#334155" stroke-width="1"/>

    <text x="10" y="125" fill="#38bdf8" font-family="monospace" font-size="9">+ pollInput() override</text>
    <text x="10" y="145" fill="#38bdf8" font-family="monospace" font-size="9">+ getVelocity()</text>
    <text x="10" y="165" fill="#38bdf8" font-family="monospace" font-size="9">+ isResetTriggered()</text>
    <text x="10" y="185" fill="#94a3b8" font-family="monospace" font-size="8.5">- pollKeys(WASD)</text>
    <text x="90" y="226" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle" font-style="italic">Standalone Fallback</text>
  </g>

  <!-- 4. VisualizerEngine (Orchestrator Facade) in Center -->
  <g transform="translate(435, 60)" filter="url(#shadow)">
    <rect width="250" height="240" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <rect width="250" height="32" rx="10" fill="url(#headerPurple)"/>
    <rect x="0" y="20" width="250" height="12" fill="url(#headerPurple)"/>
    <text x="125" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">VisualizerEngine</text>

    <!-- Attributes -->
    <text x="10" y="48" fill="#cbd5e1" font-family="monospace" font-size="9">- screenWidth: int = 1280</text>
    <text x="10" y="63" fill="#cbd5e1" font-family="monospace" font-size="9">- screenHeight: int = 720</text>
    <text x="10" y="78" fill="#cbd5e1" font-family="monospace" font-size="9">- targetFPS: int = 60</text>
    <text x="10" y="93" fill="#cbd5e1" font-family="monospace" font-size="9">- source: AcousticSource</text>
    <text x="10" y="108" fill="#cbd5e1" font-family="monospace" font-size="9">- wavePool: WavefrontPool</text>
    <text x="10" y="123" fill="#cbd5e1" font-family="monospace" font-size="9">- input: unique_ptr&lt;IInput&gt;</text>

    <line x1="0" y1="133" x2="250" y2="133" stroke="#334155" stroke-width="1"/>

    <!-- Methods -->
    <text x="10" y="152" fill="#c084fc" font-family="monospace" font-size="9.5">+ run(): void</text>
    <text x="10" y="169" fill="#c084fc" font-family="monospace" font-size="9.5">+ update(float dt): void</text>
    <text x="10" y="186" fill="#c084fc" font-family="monospace" font-size="9.5">+ render(): void</text>
    <text x="10" y="203" fill="#c084fc" font-family="monospace" font-size="9.5">+ renderHUD(MachInfo): void</text>
    <text x="125" y="226" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" font-style="italic">Facade &amp; Application Loop</text>
  </g>

  <!-- Dependency from Engine to Input Interface -->
  <path d="M 435 110 L 300 110" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="300,110 310,105 310,115" fill="#c084fc"/>
  <text x="367" y="102" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">owns</text>

  <!-- 5. AcousticSource (Kinematic Entity) -->
  <g transform="translate(710, 60)" filter="url(#shadow)">
    <rect width="260" height="210" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect width="260" height="32" rx="10" fill="url(#headerAmber)"/>
    <rect x="0" y="20" width="260" height="12" fill="url(#headerAmber)"/>
    <text x="130" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">AcousticSource</text>

    <!-- Attributes -->
    <text x="10" y="48" fill="#cbd5e1" font-family="monospace" font-size="9">- pos: Vector2</text>
    <text x="10" y="63" fill="#cbd5e1" font-family="monospace" font-size="9">- velocity: Vector2</text>
    <text x="10" y="78" fill="#cbd5e1" font-family="monospace" font-size="9">- soundSpeed (c): float = 340.0</text>
    <text x="10" y="93" fill="#cbd5e1" font-family="monospace" font-size="9">- emitPeriod: float = 0.05</text>
    <text x="10" y="108" fill="#cbd5e1" font-family="monospace" font-size="9">- emitTimer: float</text>

    <line x1="0" y1="118" x2="260" y2="118" stroke="#334155" stroke-width="1"/>

    <!-- Methods -->
    <text x="10" y="137" fill="#fbbf24" font-family="monospace" font-size="9.5">+ updateKinematics(vel, dt)</text>
    <text x="10" y="154" fill="#fbbf24" font-family="monospace" font-size="9.5">+ getMachNumber(): float</text>
    <text x="10" y="171" fill="#fbbf24" font-family="monospace" font-size="9.5">+ getMachAngle(): float</text>
    <text x="10" y="188" fill="#fbbf24" font-family="monospace" font-size="9.5">+ shouldEmit(dt): bool</text>
    <text x="130" y="202" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle" font-style="italic">Kinematics &amp; Aerodynamic State</text>
  </g>

  <!-- Composition line from Engine to Source -->
  <path d="M 685 140 L 710 140" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="685,140 693,135 701,140 693,145" fill="#fbbf24"/>
  <text x="698" y="132" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">1</text>

  <!-- 6. Wavefront (Value Object) -->
  <g transform="translate(435, 320)" filter="url(#shadow)">
    <rect width="250" height="165" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
    <rect width="250" height="30" rx="10" fill="url(#headerPink)"/>
    <rect x="0" y="20" width="250" height="10" fill="url(#headerPink)"/>
    <text x="125" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">struct Wavefront</text>

    <text x="10" y="48" fill="#cbd5e1" font-family="monospace" font-size="9">+ origin: Vector2</text>
    <text x="10" y="65" fill="#cbd5e1" font-family="monospace" font-size="9">+ birthTime: float</text>
    <text x="10" y="82" fill="#cbd5e1" font-family="monospace" font-size="9">+ radius: float</text>
    <text x="10" y="99" fill="#cbd5e1" font-family="monospace" font-size="9">+ active: bool</text>

    <line x1="0" y1="109" x2="250" y2="109" stroke="#334155" stroke-width="1"/>

    <text x="10" y="128" fill="#f472b6" font-family="monospace" font-size="9">+ expand(speed, dt): void</text>
    <text x="10" y="145" fill="#f472b6" font-family="monospace" font-size="9">+ isOffScreen(w, h): bool</text>
    <text x="125" y="158" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle" font-style="italic">Lightweight Circular Wave Entity</text>
  </g>

  <!-- 7. WavefrontPool (Manager / Ring Allocator) -->
  <g transform="translate(710, 290)" filter="url(#shadow)">
    <rect width="260" height="195" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect width="260" height="30" rx="10" fill="#be123c"/>
    <rect x="0" y="20" width="260" height="10" fill="#be123c"/>
    <text x="130" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">WavefrontPool</text>

    <text x="10" y="48" fill="#cbd5e1" font-family="monospace" font-size="9">- waves: array&lt;Wavefront, MAX&gt;</text>
    <text x="10" y="65" fill="#cbd5e1" font-family="monospace" font-size="9">- headIdx: size_t</text>
    <text x="10" y="82" fill="#cbd5e1" font-family="monospace" font-size="9">- activeCount: size_t</text>
    <text x="10" y="99" fill="#cbd5e1" font-family="monospace" font-size="9">- speedOfSound: float</text>

    <line x1="0" y1="109" x2="260" y2="109" stroke="#334155" stroke-width="1"/>

    <text x="10" y="128" fill="#fb7185" font-family="monospace" font-size="9">+ emitWave(origin, time)</text>
    <text x="10" y="145" fill="#fb7185" font-family="monospace" font-size="9">+ updateAll(dt): void</text>
    <text x="10" y="162" fill="#fb7185" font-family="monospace" font-size="9">+ renderAll(): void</text>
    <text x="10" y="179" fill="#fb7185" font-family="monospace" font-size="9">+ cullOffscreen(): void</text>
    <text x="130" y="190" fill="#fb7185" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle" font-style="italic">O(1) Circular Ring Pool</text>
  </g>

  <!-- Aggregation line from WavefrontPool to Wavefront -->
  <path d="M 710 390 L 685 390" stroke="#f472b6" stroke-width="1.5"/>
  <polygon points="710,390 702,385 694,390 702,395" fill="#f472b6"/>
  <text x="698" y="382" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">1..*</text>

  <!-- Composition line from Engine to WavefrontPool -->
  <path d="M 685 260 L 760 260 L 760 290" stroke="#f43f5e" stroke-width="1.5"/>
  <polygon points="685,260 693,255 701,260 693,265" fill="#f43f5e"/>

  <!-- Legend in Footer -->
  <g transform="translate(30, 495)">
    <text x="0" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">OOP Core Principles:</text>
    <text x="135" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">● Polymorphism (IInputController)</text>
    <text x="350" y="14" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10">● Encapsulation (AcousticSource / SerialWorker)</text>
    <text x="650" y="14" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="10">● Memory Reuse (Object Pool Pattern)</text>
  </g>
</svg>