<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 310" width="950" height="310">
  <defs>
    <linearGradient id="bgCirc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <filter id="circShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="310" rx="14" fill="url(#bgCirc)"/>
  <rect x="1" y="1" width="948" height="308" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ELECTRICAL CIRCUIT DIAGRAM: SENSOR VOLTAGE DIVIDERS &amp; ATMEGA328P ADC INTERFACE</text>

  <!-- ================= LEFT BOX: KY-023 JOYSTICK CIRCUIT ================= -->
  <g transform="translate(30, 40)" filter="url(#circShadow)">
    <rect width="360" height="250" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="360" height="26" rx="10" fill="#0284c7"/>
    <rect x="0" y="14" width="360" height="12" fill="#0284c7"/>
    <text x="180" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">KY-023 Joystick Module Schematic</text>

    <!-- +5V Rail on Top -->
    <line x1="30" y1="50" x2="330" y2="50" stroke="#ef4444" stroke-width="2"/>
    <text x="25" y="53" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">+5V Rail</text>
    <circle cx="65" cy="50" r="3" fill="#ef4444"/>
    <circle cx="175" cy="50" r="3" fill="#ef4444"/>

    <!-- GND Rail on Bottom -->
    <line x1="30" y1="215" x2="330" y2="215" stroke="#94a3b8" stroke-width="2"/>
    <text x="25" y="218" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">GND</text>
    <circle cx="65" cy="215" r="3" fill="#94a3b8"/>
    <circle cx="175" cy="215" r="3" fill="#94a3b8"/>
    <circle cx="285" cy="215" r="3" fill="#94a3b8"/>

    <!-- 1. VRX Potentiometer (left) -->
    <line x1="65" y1="50" x2="65" y2="85" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Resistor zig-zag -->
    <path d="M 65 85 L 55 93 L 75 101 L 55 109 L 75 117 L 55 125 L 75 133 L 55 141 L 65 149" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="65" y1="149" x2="65" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="45" y="118" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="end">Rx (10kΩ)</text>
    <!-- Wiper arrow for VRX -->
    <line x1="65" y1="117" x2="105" y2="117" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="65,117 73,113 73,121" fill="#38bdf8"/>
    <line x1="105" y1="117" x2="105" y2="90" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="105" y1="90" x2="345" y2="90" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="345" cy="90" r="4" fill="#38bdf8"/>
    <text x="335" y="82" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="end">VRX (0–5V)</text>

    <!-- 2. VRY Potentiometer (center) -->
    <line x1="175" y1="50" x2="175" y2="85" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 175 85 L 165 93 L 185 101 L 165 109 L 185 117 L 165 125 L 185 133 L 165 141 L 175 149" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <line x1="175" y1="149" x2="175" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="155" y="118" fill="#2dd4bf" font-family="monospace" font-size="9" text-anchor="end">Ry (10kΩ)</text>
    <!-- Wiper arrow for VRY -->
    <line x1="175" y1="117" x2="215" y2="117" stroke="#2dd4bf" stroke-width="1.5"/>
    <polygon points="175,117 183,113 183,121" fill="#2dd4bf"/>
    <line x1="215" y1="117" x2="215" y2="135" stroke="#2dd4bf" stroke-width="1.5"/>
    <line x1="215" y1="135" x2="345" y2="135" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="345" cy="135" r="4" fill="#2dd4bf"/>
    <text x="335" y="127" fill="#2dd4bf" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="end">VRY (0–5V)</text>

    <!-- 3. Push Switch (SW, right) -->
    <line x1="285" y1="215" x2="285" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Switch terminals & blade -->
    <circle cx="285" cy="185" r="3" fill="#cbd5e1"/>
    <line x1="285" y1="185" x2="300" y2="165" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="285" cy="165" r="3" fill="#cbd5e1"/>
    <line x1="285" y1="165" x2="345" y2="165" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="345" cy="165" r="4" fill="#fbbf24"/>
    <text x="335" y="157" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="end">SW (Active LOW)</text>
    <text x="265" y="177" fill="#fbbf24" font-family="monospace" font-size="8.5" text-anchor="end">SW1</text>
  </g>

  <!-- ================= CENTER INTERCONNECT BUS ================= -->
  <g transform="translate(400, 40)">
    <!-- Signal wires passing across -->
    <!-- 5V -->
    <line x1="-10" y1="50" x2="130" y2="50" stroke="#ef4444" stroke-width="2"/>
    <text x="60" y="44" fill="#ef4444" font-family="monospace" font-size="8" text-anchor="middle">+5V Power</text>

    <!-- VRX -->
    <line x1="-25" y1="90" x2="130" y2="90" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="84" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Analog VRX (0–5V)</text>

    <!-- VRY -->
    <line x1="-25" y1="135" x2="130" y2="135" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="60" y="129" fill="#2dd4bf" font-family="monospace" font-size="8" text-anchor="middle">Analog VRY (0–5V)</text>

    <!-- SW -->
    <line x1="-25" y1="165" x2="130" y2="165" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="60" y="159" fill="#fbbf24" font-family="monospace" font-size="8" text-anchor="middle">Digital SW (LOW/HIGH)</text>

    <!-- GND -->
    <line x1="-10" y1="215" x2="130" y2="215" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="209" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Common GND</text>
  </g>

  <!-- ================= RIGHT BOX: ARDUINO ATMEGA328P CIRCUIT ================= -->
  <g transform="translate(540, 40)" filter="url(#circShadow)">
    <rect width="380" height="250" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect width="380" height="26" rx="10" fill="#0d9488"/>
    <rect x="0" y="14" width="380" height="12" fill="#0d9488"/>
    <text x="190" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Arduino Uno (ATmega328P) Internal Subsystem</text>

    <!-- Pin Headers on Left Edge -->
    <!-- Pin 5V -->
    <circle cx="15" cy="50" r="4" fill="#ef4444"/>
    <text x="25" y="53" fill="#ef4444" font-family="monospace" font-size="8.5" font-weight="bold">5V (Regulator Output)</text>

    <!-- Pin A0 -->
    <circle cx="15" cy="90" r="4" fill="#38bdf8"/>
    <text x="25" y="93" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">A0 (ADC0)</text>
    <line x1="75" y1="90" x2="135" y2="90" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Pin A1 -->
    <circle cx="15" cy="135" r="4" fill="#2dd4bf"/>
    <text x="25" y="138" fill="#2dd4bf" font-family="monospace" font-size="8.5" font-weight="bold">A1 (ADC1)</text>
    <line x1="75" y1="135" x2="135" y2="135" stroke="#2dd4bf" stroke-width="1.5"/>

    <!-- Pin D2 -->
    <circle cx="15" cy="165" r="4" fill="#fbbf24"/>
    <text x="25" y="168" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="bold">D2 (INT0)</text>
    <line x1="75" y1="165" x2="105" y2="165" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Pullup Resistor for D2 inside MCU -->
    <line x1="105" y1="165" x2="105" y2="80" stroke="#fbbf24" stroke-width="1.2"/>
    <!-- Pullup Resistor zig-zag -->
    <path d="M 105 80 L 100 75 L 110 70 L 100 65 L 110 60 L 105 55" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <line x1="105" y1="55" x2="105" y2="50" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="105" cy="50" r="2.5" fill="#ef4444"/>
    <text x="114" y="70" fill="#fbbf24" font-family="monospace" font-size="7">R_pullup (30kΩ)</text>
    <line x1="105" y1="165" x2="135" y2="165" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Pin GND -->
    <circle cx="15" cy="215" r="4" fill="#94a3b8"/>
    <text x="25" y="218" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="bold">GND (Common)</text>

    <!-- ATmega328P Processing Block -->
    <rect x="135" y="65" width="225" height="155" rx="8" fill="#131e33" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="247" y="85" fill="#2dd4bf" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ATmega328P Core</text>

    <!-- ADC Box -->
    <rect x="145" y="95" width="205" height="48" rx="6" fill="#0b1220" stroke="#38bdf8" stroke-width="1"/>
    <text x="155" y="112" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">10-Bit SAR ADC (MUX)</text>
    <text x="155" y="126" fill="#cbd5e1" font-family="monospace" font-size="7.5">V_ref = 5.0V • Resolution = 4.88 mV/LSB</text>
    <text x="155" y="137" fill="#94a3b8" font-family="monospace" font-size="7.5">Sampling rate: 60 Hz paced timer</text>

    <!-- UART Serial Out Box -->
    <rect x="145" y="152" width="205" height="58" rx="6" fill="#0b1220" stroke="#c084fc" stroke-width="1"/>
    <text x="155" y="169" fill="#c084fc" font-family="monospace" font-size="8.5" font-weight="bold">USART / USB CDC Stream</text>
    <text x="155" y="183" fill="#cbd5e1" font-family="monospace" font-size="7.5">Baud: 115200 (8-N-1) • Frame: "X,Y,SW
"</text>
    <text x="155" y="196" fill="#facc15" font-family="monospace" font-size="7.5">Transmit to Host Serial Worker Thread ──►</text>
  </g>
</svg>